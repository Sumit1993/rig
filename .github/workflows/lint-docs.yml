name: lint-docs
on:
  pull_request:
  push:
    branches: [master]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash plugins/rig/scripts/lint-skill-docs.sh

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The hook suites gate code Claude Code runs on every tool call, so a break here
      # is a break in every session. replay-transcripts.sh finds no transcripts on a
      # runner and exits clean; it is the local pass that has real payloads to replay.
      - run: bash plugins/rig/hooks/tests/run-all.sh

  skill-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r plugins/rig/skills/adversary/requirements.txt
      - run: python -m unittest discover -s plugins/rig/skills/adversary/tests -v
      - run: python -m unittest discover -s plugins/rig/skills/codex-desktop/tests -v

  builders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds every dotfiles/harnesses.json target into a temp dir; agy validate is skipped without agy.
      - run: bash dotfiles/tests/test-builders.sh
